# 敌方历史战役行动脚本：tN为固定回合，everyNt为周期行动。
#
# battleStart=  ：关卡开局效果，战斗开始时结算一次（不走行动队列，所以不会作为
#                 敌方意图显示在左侧面板上）。效果来源卡是敌方总部，条件直接用
#                 通用的 if(...)跳转 写，可用的 &hp 是战役血量（世界地图上心形
#                 图标后面那个数）。不写这个键的关卡就是没有开局效果。
#                 例：battleStart=myHq|heal(&hp*10)   —— 每有1条命，友方总部+10防御
#
# area2：1941年夏季，巴巴罗萨行动初期（6关）

