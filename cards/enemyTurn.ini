# ============================================================
# area2：斯大林格勒战区（6关）
# 每个关卡对应1942年斯大林格勒方向的一个作战地区，六关难度相当。
# 每关用不同的压力形状表达主题：洪流 / 抢时间 / 封锁 / 无底洞 / 打不动 / 总崩溃。
# 不使用 myHq|KillAllTargets 秒杀友方总部，压力一律由持续时钟给出。
# ============================================================

# 背景：1942年7月德军第6集团军在顿河大弯曲部强渡，草原上无险可守；建议区域：area2；主题：装甲洪流，每回合都有新坦克碾过来，靠数量不靠强度。
[DonBend]
name=顿河大弯曲部
t1=ADD:addToEnemySupportLine(de_panzer4)[icon=bigUnit,description=部署四号坦克]
t2=addToEnemySupportLine(de_panzer4),addToEnemySupportLine(de_panzer4)[icon=bigUnit,description=部署四号坦克*2]
t4=GetAllEnemyUnits|GetAttack(1)[icon=upgrade,description=所有敌方单位获得+1攻击力]
t6=ADD:addToEnemySupportLine(de_sturmpionier)[icon=normalUnit,description=部署突击工兵]
t9=addToEnemySupportLine(de_panzer4),addToEnemySupportLine(de_panzer4),addToEnemySupportLine(de_panzer4)[icon=bigUnit,description=部署四号坦克*3]
t12=ADD:GetAllEnemyUnits|GetAttack(1)[icon=upgrade,description=所有敌方单位获得+1攻击力]

# 背景：1942年8月德军突袭卡拉奇顿河大桥，抢在苏军炸桥前夺占通道；建议区域：area2；主题：闪电夺桥，压力全堆在前段，开局就压上重兵。
[Kalach]
name=卡拉奇桥头堡
t1=addToEnemySupportLine(de_panzer4),addToEnemySupportLine(de_panzer4),addToEnemySupportLine(de_sturmpionier),addToEnemySupportLine(de_sturmpionier)[icon=bigUnit,description=部署四号坦克*2、突击工兵*2]
t2=ADD:addToEnemySupportLine(de_panzer4)[icon=bigUnit,description=部署四号坦克]
t3=ADD:myHq|damage(4)[icon=damage,description=对友方总部造成4点伤害]
t5=GetAllEnemyUnits|GetAttack(1)|Heal(1)[icon=upgrade,description=所有敌方单位获得+1攻击力+1防御力]
t7=addToEnemySupportLine(de_panzer4),addToEnemySupportLine(de_panzer4),addToEnemySupportLine(de_panzer4)[icon=bigUnit,description=部署四号坦克*3]
t10=GetAllEnemyUnits|GetAttack(1)[icon=upgrade,description=所有敌方单位获得+1攻击力]

# 背景：1942年8至9月德军以炮火与航空兵封锁伏尔加河渡口，第62集团军补给濒临断绝；建议区域：area2；主题：火力封锁，一个步兵都不派，只有炮与飞机，你只能挨打。
