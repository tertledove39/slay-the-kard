t5=addToEnemySupportLine(de_sturmpionier)
t7=GetAllEnemyUnits|GetAttack(1)
t10=GetAllEnemyUnits|GetAttack(1)
t12=enemyHq|Heal(5)
t14=addToEnemySupportLine(de_mg42)
t16=myHq|KillAllTargets

