t1=addToEnemySupportLine(de_88mm),addToEnemySupportLine(de_88mm),addToEnemySupportLine(de_88mm)[icon=normalUnit,description=部署88毫米炮*3]
t2=ADD:GetRandomFriendUnit|damage(3)[icon=damage,description=对随机友方单位造成3点伤害]
t4=addToEnemySupportLine(de_stuka),addToEnemySupportLine(de_stuka),addToEnemySupportLine(de_stuka)[icon=normalUnit,description=部署斯图卡*3]
t6=ADD:GetRandomFriendUnit|AddTrait(Suppressed)[icon=damage,description=压制1个随机友方单位]
t9=addToEnemySupportLine(de_88mm),addToEnemySupportLine(de_88mm),addToEnemySupportLine(de_88mm)[icon=normalUnit,description=部署88毫米炮*3]
t12=ADD:myHq|damage(3)[icon=damage,description=对友方总部造成3点伤害]

