# ============================================================
# 敌方行动脚本配置
# 每个节是一个敌人预设，键值对为回合数=行动
# tN = 第N回合执行
# everyNt = 每N回合执行
# ADD: 前缀表示添加到永久队列（每回合执行）
# 每个行动字符串末尾可附加 [icon=xxx,description=人话描述]
# ============================================================

# ============================================================
# 敌人：最终防线 [berlin]
# 背景：柏林最后的防线，虎式坦克+党卫军精锐的最终抵抗
# 主题：重坦+精英步兵
# ============================================================
[berlin]
t1=ADD:addToEnemySupportLine(de_ss_guard)[icon=boss,description=每回合部署党卫军卫队]
t3=addToEnemySupportLine(de_tiger)[icon=boss,description=部署虎式重坦]
t4=addToEnemySupportLine(de_ss_guard)[icon=boss,description=部署党卫军卫队]
t6=addToEnemySupportLine(de_88mm)[icon=boss,description=部署88毫米炮]
t7=enemyHq|Heal(10)[icon=boss,description=总部回复10点防御]
t9=addToEnemySupportLine(de_tiger)[icon=boss,description=部署虎式重坦]
every8t=ADD:addToEnemySupportLine(de_panzer4)[icon=boss,description=每回合部署四号坦克]
every5t=addToEnemySupportLine(de_panther)[icon=boss,description=部署黑豹坦克]
every6t=ADD:enemyHq|Heal(4)[icon=boss,description=每回合总部回复4点防御]
t14=addToEnemySupportLine(de_ss_guard)[icon=boss,description=部署党卫军卫队]
t16=GetAllEnemyUnits|GetAttack(1)[icon=boss,description=全军攻击力+1]
every10t=GetRandomEnemyUnit|Heal(5)[icon=boss,description=随机单位回复5点]
t28=myHq|KillAllTargets[icon=boss,description=摧毁我方总部]

# ============================================================
# 敌人：德国国防军步兵师 [wehrmacht]
# 背景：莫斯科外围遭遇的第一支德军正规步兵师
# 主题：步兵协同，均衡推进
# ============================================================
[wehrmacht]
t1=addToEnemySupportLine(de_infantry)[icon=boss,description=部署德国步兵]
t2=addToEnemySupportLine(de_sturmpionier)[icon=boss,description=部署突击工兵]
t3=addToEnemySupportLine(de_mg42)[icon=boss,description=部署MG42机枪组]
every5t=addToEnemySupportLine(de_infantry)[icon=boss,description=部署德国步兵]
t5=addToEnemySupportLine(de_sturmpionier)[icon=boss,description=部署突击工兵]
t7=addToEnemySupportLine(de_mg42)[icon=boss,description=部署MG42机枪组]
t9=GetAllEnemyUnits|GetAttack(1)[icon=boss,description=全军攻击力+1]
every8t=ADD:enemyHq|Heal(2)[icon=boss,description=每回合总部回复2点防御]
t11=addToEnemySupportLine(de_panzer4)[icon=boss,description=部署四号坦克]
t14=GetAllEnemyUnits|GetAttack(1)[icon=boss,description=全军攻击力+1]
t18=myHq|KillAllTargets[icon=boss,description=摧毁我方总部]

# ============================================================
# 敌人：德国空军联队 [luftflotte]
# 背景：德军空中优势部队，斯图卡尖啸俯冲轰炸
# 主题：空军+炮兵、远程压制
# ============================================================
[luftflotte]
t1=addToEnemySupportLine(de_stuka)[icon=boss,description=部署斯图卡]
t2=addToEnemySupportLine(de_fallschirmjager)[icon=boss,description=部署伞兵]
every3t=ADD:GetRandomEnemyUnit|GetAttack(1)[icon=boss,description=每回合随机单位攻击力+1]
t4=addToEnemySupportLine(de_88mm)[icon=boss,description=部署88毫米炮]
t5=addToEnemySupportLine(de_stuka)[icon=boss,description=部署斯图卡]
t7=GetRandomFriendUnit|damage(2)[icon=boss,description=对我方随机单位造成2点伤害]
t9=addToEnemySupportLine(de_fallschirmjager)[icon=boss,description=部署伞兵]
every5t=ADD:GetRandomFriendUnit|damage(1)[icon=boss,description=每回合对我方随机单位造成1点伤害]
t11=addToEnemySupportLine(de_stuka)[icon=boss,description=部署斯图卡]
t13=GetRandomFriendUnit|damage(3)[icon=boss,description=对我方随机单位造成3点伤害]
t16=addToEnemySupportLine(de_88mm)[icon=boss,description=部署88毫米炮]
t22=myHq|KillAllTargets[icon=boss,description=摧毁我方总部]

