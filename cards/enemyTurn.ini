# 背景：1941年6月德军越过布格河突袭布列斯特要塞；建议区域：area2；主题：工兵破障与步兵强攻。
[moscow_battle]
name=莫斯科保卫战
t1=ADD:addToEnemySupportLine(de_infantry)[icon=normalUnit,description=部署第1步兵团]
t3=ADD:enemyHq|heal(2)[icon=heal,description=敌方总部获得2点防御力]
t6=ADD:addToEnemySupportLine(de_panzer4)[icon=normalUnit,description=部署4号坦克]
t12=enemyHq|KillAllTarget[icon=damage,description=敌军撤退]

# 背景：1941年6月北方集团军群在拉塞尼艾遭遇苏军重坦；建议区域：area2；主题：反坦克炮与装甲遭遇。
