every5t=GetRandomFriendUnit|KillAllTarget[icon=damage,description=随机消灭1个友方单位]
t3=ADD:addToEnemySupportLine(de_88mm)[icon=normalUnit,description=部署88毫米炮]
t6=ADD:addToEnemySupportLine(de_panther)[icon=boss,description=部署黑豹]
