# === 新增5种敌人行为 (2026-06-16) ===

# 1. 周期性炮击压制：每3回合随机伤害一个友方单位1点
every3t = ADD:GetRandomFriendUnit|damage(1)

# 2. 工业总动员：第8回合全体敌方单位+1攻击力
t8 = GetAllEnemyUnits|GetAttack(1)

# 3. 精英装甲增援：第14回合部署重型坦克is2
t14 = addToEnemySupportLine(is2)

# 4. 阵地整修：每12回合敌方总部回复8点 + 每13回合随机敌方单位回复3点
every12t = enemyHq|Heal(8)
every13t = GetRandomEnemyUnit|Heal(3)

# 5. 钢铁防线：第18回合全体敌方单位+1防御力
t18 = GetAllEnemyUnits|addDefence(1)
