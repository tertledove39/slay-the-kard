# ============================================================
# 敌方行动脚本配置
# 每个节是一个敌人预设，键值对为回合数=行动
# tN = 第N回合执行
# everyNt = 每N回合执行
# ADD: 前缀表示添加到永久队列（每回合执行）
# ============================================================

# ============================================================
# 敌人：最终防线 [berlin]
# 背景：柏林最后的防线，虎式坦克+党卫军精锐的最终抵抗
# 主题：重坦+精英步兵
# ============================================================
[berlin]
t1=ADD:addToEnemySupportLine(de_ss_guard)
t3=addToEnemySupportLine(de_tiger)
t4=addToEnemySupportLine(de_ss_guard)
t6=addToEnemySupportLine(de_88mm)
t7=enemyHq|Heal(10)
t9=addToEnemySupportLine(de_tiger)
every8t=ADD:addToEnemySupportLine(de_panzer4)
every5t=addToEnemySupportLine(de_panther)
every6t=ADD:enemyHq|Heal(4)
t14=addToEnemySupportLine(de_ss_guard)
t16=GetAllEnemyUnits|GetAttack(1)
every10t=GetRandomEnemyUnit|Heal(5)
t28=myHq|KillAllTargets

# ============================================================
# 敌人：德国国防军步兵师 [wehrmacht]
# 背景：莫斯科外围遭遇的第一支德军正规步兵师
# 主题：步兵协同，均衡推进
# ============================================================
[wehrmacht]
t1=addToEnemySupportLine(de_infantry)
t2=addToEnemySupportLine(de_sturmpionier)
t3=addToEnemySupportLine(de_mg42)
every5t=addToEnemySupportLine(de_infantry)
t5=addToEnemySupportLine(de_sturmpionier)
t7=addToEnemySupportLine(de_mg42)
t9=GetAllEnemyUnits|GetAttack(1)
every8t=ADD:enemyHq|Heal(2)
t11=addToEnemySupportLine(de_panzer4)
t14=GetAllEnemyUnits|GetAttack(1)
t18=myHq|KillAllTargets

# ============================================================
# 敌人：德国空军联队 [luftflotte]
# 背景：德军空中优势部队，斯图卡尖啸俯冲轰炸
# 主题：空军+炮兵、远程压制
# ============================================================
[luftflotte]
t1=addToEnemySupportLine(de_stuka)
t2=addToEnemySupportLine(de_fallschirmjager)
every3t=ADD:GetRandomEnemyUnit|GetAttack(1)
t4=addToEnemySupportLine(de_88mm)
t5=addToEnemySupportLine(de_stuka)
t7=GetRandomFriendUnit|damage(2)
t9=addToEnemySupportLine(de_fallschirmjager)
every5t=ADD:GetRandomFriendUnit|damage(1)
t11=addToEnemySupportLine(de_stuka)
t13=GetRandomFriendUnit|damage(3)
t16=addToEnemySupportLine(de_88mm)
t22=myHq|KillAllTargets

# ============================================================
# 敌人：党卫军装甲师 [ss_panzer]
# 背景：武装党卫队精锐装甲师，黑豹虎式钢铁洪流
# 主题：重坦集群、攻击buff滚雪球
# ============================================================
[ss_panzer]
t1=addToEnemySupportLine(de_panzer4)
t2=addToEnemySupportLine(de_panther)
t4=addToEnemySupportLine(de_tiger)
t5=GetRandomEnemyUnit|GetAttack(2)
every7t=ADD:addToEnemySupportLine(de_panzer4)
t7=addToEnemySupportLine(de_panther)
t9=GetAllEnemyUnits|GetAttack(1)
t11=addToEnemySupportLine(de_tiger)
t13=GetAllEnemyUnits|GetAttack(2)
t16=addToEnemySupportLine(de_sturmpionier)
t19=addToEnemySupportLine(de_tiger)
t24=myHq|KillAllTargets

# ============================================================
# 敌人：东方壁垒防线 [ostwall]
# 背景：德军在东线构筑的纵深防御体系，碉堡88炮层层阻击
# 主题：高防御、高回复、持久消耗
# ============================================================
[ostwall]
t1=enemyHq|Heal(8)
t2=addToEnemySupportLine(de_88mm)
every4t=ADD:enemyHq|Heal(2)
t4=addToEnemySupportLine(de_bunker)
t6=addToEnemySupportLine(de_mg42)
t8=GetRandomEnemyUnit|addDefence(1)
t10=addToEnemySupportLine(de_bunker)
t12=GetAllEnemyUnits|addDefence(2)
t14=addToEnemySupportLine(de_88mm)
t16=enemyHq|Heal(12)
t18=addToEnemySupportLine(de_panther)
t20=GetAllEnemyUnits|addDefence(1)
t28=myHq|KillAllTargets

