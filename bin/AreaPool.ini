# 区域任务池：每个section定义一个区域的可选任务
# enemyN填enemyTurn.ini的section名，entryN填event:事件ID
# boss填该区域的终局战斗section名（见 docs/CONFIG.md）
#
# 区域按地理位置命名、按历史时序推进：
#   area1 莫斯科(1941秋-1942初) → area2 斯大林格勒(1942夏-1943初) → area3 斯摩棱斯克(1943秋)
#   → area4 哈尔科夫(1943春) → area5 库尔斯克(1943夏) → area6 明斯克(1944夏) → area7 柏林(1945春)
# 事件按各自的历史时点分配到对应区域，全程性事件（如通信混乱、坦克乘员补充）
# 可跨多个区域出现；同一事件在同一区域内只列一次。

