[order_227]
title = <事件>第227号命令
image = res://assest/EventTest.png
description = 命令是7月28日签发的，到你们手上已经过了一个星期。政委在空地上把全文念完，风把纸吹得哗哗响，念到「一步也不许后退」时他停了一下，又念了一遍。队伍里没有人说话。接下来是组建惩罚营和拦截队的细则。
choice1_text = 照章办事，把各连的刺头送进惩罚营(将3张轻步兵加入卡组，另有1张卡被替换为预备役)
choice1_effect = replaceCard(轻步兵),replaceCard(轻步兵),replaceCard(轻步兵),replaceRandomCard(预备役)
choice2_text = 只把命令传达给营级主官(将1张第227号命令加入卡组)
choice2_effect = replaceCard(第227号命令)

[siberian_transfer]
title = <事件>来自远东的列车
image = res://assest/EventTest.png
description = 一列列车从东边开来，车上是穿得比你们厚实得多的部队。他们在远东待了两年，没见过德军的坦克。有人问他们怕不怕冷，他们反问：你们这儿算冷吗。站台上有人在数车皮，数到第十七节就放弃了。
choice1_text = 整建制投入一线(将1张西伯利亚转移加入卡组)
choice1_effect = replaceCard(西伯利亚转移)
choice2_text = 打散补充到各师(将4张步兵第414团加入卡组，失去8点资源点)
choice2_effect = replaceCard(i414),replaceCard(i414),replaceCard(i414),replaceCard(i414),materialPoints(-8)

[arctic_convoy]
title = <事件>北极护航队
image = res://assest/EventTest.png
description = 英国人的船队从冰岛出发，走北极航线。那边现在是没有黑夜的季节，也就是没有天黑可以藏。报告说德军的水上飞机已经找到他们了。你们这边能做的只有等，还有把跑道上的雪扫干净。
choice1_text = 等船队到港(将1张北极护航队加入卡组)
choice1_effect = replaceCard(北极护航队)
choice2_text = 把跑道上的东西提前撤走(什么都不发生)
choice2_effect = none
choice3_text = 派飞机去接应(失去8点资源点，额外获得1张北极护航队)
choice3_effect = materialPoints(-8),replaceCard(北极护航队),replaceCard(北极护航队)
