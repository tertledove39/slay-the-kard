# 事件配置：每个事件提供2至3个选项
# 效果仅使用 none、replaceCard 和 replaceRandomCard

[reserve_callup]
title = <事件>征召预备役
image = res://assest/EventTest.png
description = 前线战局告急...现在部队正经过一个火车站.来自后方的消息是,一批士兵即将来到这个火车站,但前方战局吃紧,你可能必须要开进了...
choice1_text = 等待集结，补充三批预备役(将3张预备役加入卡组)
choice1_effect = replaceCard(预备役),replaceCard(预备役),replaceCard(预备役)
choice2_text = 继续前进，接收一批征召兵(将1张征召兵加入卡组)
choice2_effect = replaceCard(征召兵)

[border_alarm]
title = <事件>边境警报
image = res://assest/EventTest.png
description = 德军越过边境后，零散部队正向东撤退。你可以收拢人员，也可以保持纵队完整迅速转移。
choice1_text = 收拢散兵，补入步兵第554团
choice1_effect = replaceCard(i554),replaceRandomCard(预备役)
choice2_text = 不作停留
choice2_effect = none

[strange_command]
title = <事件>奇怪的命令
image = res://assest/EventTest.png
description = 来自后方的命令要求你和你的部队在2天内到达50公里外的某个地点。虽然很疑惑，你命令还是照做了。可奇怪的是，1天后，你们又被要求返回原来的位置
choice1_text = 何意味(失去5点资源点)
choice1_effect = materialPoints(-5)


[snowstorm]
title = 暴风雪
image = res://assest/EventTest.png
description = 一场突如其来的暴风雪打乱了我们的安排...我们必须快速地重新准备进攻计划，即使这意味着必须放弃些什么
choice1_text = 周详地计划(将2张卡替换为计划)
choice1_effect = replaceCard(计划),replaceCard(计划)
choice2_text = 简单地谋划(将10张卡替换为谋划)
choice2_effect = replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划)
choice3_text = 直接地埋伏(将20张卡替换为埋伏)
choice3_effect = replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏)



#stop

# ============================================================
# 新增事件（待验收）
# ============================================================

[abandoned_depot]
title = <事件>集体农庄的仓库
image = res://assest/EventTest.png
description = 路过一座被丢下的集体农庄。仓库门锁着，窗户倒是破的。里面堆着大概是给前线备下的东西：面粉、靴子、两箱炮弹。墙角还蹲着十几个人，是没来得及撤走的本地人，他们看着你们，不说话。
choice1_text = 征用物资，人留在这里(获得10点资源点)
choice1_effect = materialPoints(10)
choice2_text = 连人带物资一起带走(将3张预备役加入卡组，失去5点资源点)
choice2_effect = replaceCard(预备役),replaceCard(预备役),replaceCard(预备役),materialPoints(-5)

[rail_siding]
title = <事件>会让站
image = res://assest/EventTest.png
description = 在会让站等了六个小时。军列一列接一列往东开，平板车上蒙着油布，炮塔的轮廓你认得。站长说这批不归你，下一批也不归你。然后你们的车厢被摘到了侧线上。
choice1_text = 把平板车上的坦克开下来(将1辆T-34 1942加入卡组，另有1张卡被替换为预备役)
choice1_effect = replaceCard(t34_1942),replaceRandomCard(预备役)
choice2_text = 等自己的车皮(什么都不发生)
choice2_effect = none
choice3_text = 找站长理论(失去5点资源点)
choice3_effect = materialPoints(-5)
