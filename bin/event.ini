image = res://assest/EventTest.png
description = 1941年至1942年冬季，东线气温降至零下三十度以下。暴风雪可在数小时内改变战场态势，既定进攻方案随之作废。重新准备的时间极为有限，方式却不止一种：可以细密推演，可以粗略筹划，也可以放弃计划、就地设伏。
