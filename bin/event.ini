# 事件配置：每个事件提供1至3个选项
# 效果可用 none、replaceCard、replaceRandomCard、materialPoints，同一选项内可混用

[reserve_callup]
title = <事件>征召预备役
image = res://assest/EventTest.png
description = 1941年夏，红军实施全面动员，预备役人员按年龄批次征召，经铁路输送至前线。输送途中常在会让站编组，一批抵达与另一批开拔之间往往只隔数小时。接收部队须自行决定：是等待编制齐整，还是按现有员额立即开拔。
choice1_text = 等待编组齐整(将3张预备役加入卡组)
choice1_effect = replaceCard(预备役),replaceCard(预备役),replaceCard(预备役)
choice2_text = 按现有员额开拔(将1张征召兵加入卡组)
choice2_effect = replaceCard(征召兵)

[border_alarm]
title = <事件>边境警报
image = res://assest/EventTest.png
description = 1941年6月22日以后，西部各集团军的通信相继中断，建制被打散，失散人员与残部向东退却。收拢散兵可补充兵员，但须停留原地，并承担被德军先头部队追及的风险；保持行军速度，则意味着放弃这批人员。
choice1_text = 收拢散兵(将1张步兵第554团加入卡组，另有1张卡被替换为预备役)
choice1_effect = replaceCard(i554),replaceRandomCard(预备役)
choice2_text = 保持行军(无变化)
choice2_effect = none

[strange_command]
title = <事件>奇怪的命令
image = res://assest/EventTest.png
description = 1941年至1942年间，因通信不畅与指挥层级重叠，部队屡次收到相互矛盾的行军命令。某部奉命于两日内抵达五十公里外的指定地点，次日又奉命返回原驻地。往返所耗燃料与时间，事后无从追补。
choice1_text = 何意味(失去5点资源点)
choice1_effect = materialPoints(-5)


[snowstorm]
title = <事件>暴风雪
image = res://assest/EventTest.png
description = 1941年至1942年冬季，东线气温降至零下三十度以下。暴风雪可在数小时内改变战场态势，既定进攻方案随之作废。重新准备的时间极为有限，方式却不止一种：可以细密推演，可以粗略筹划，也可以放弃计划、就地设伏。
choice1_text = 周详地计划(将2张卡替换为计划)
choice1_effect = replaceCard(计划),replaceCard(计划)
choice2_text = 简单地谋划(将10张卡替换为谋划)
choice2_effect = replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划),replaceCard(谋划)
choice3_text = 直接地埋伏(将20张卡替换为埋伏)
choice3_effect = replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏),replaceCard(埋伏)



#stop

# ============================================================
# 新增事件（待验收）
# ============================================================

[order_227]
title = <事件>第227号命令
image = res://assest/EventTest.png
description = 1942年7月28日，国防人民委员第227号命令签发。命令要求各方面军组建1至3个惩罚营，每营约800人；各集团军组建5至10个拦截连，每连约200人，配置于动摇部队后方。因怯战降职者编入惩罚营，负伤可恢复原衔。文件在部队中逐级宣读。
choice1_text = 按规定组建惩罚营与拦截连(将3张轻步兵加入卡组，另有1张卡被替换为预备役)
choice1_effect = replaceCard(轻步兵),replaceCard(轻步兵),replaceCard(轻步兵),replaceRandomCard(预备役)
choice2_text = 仅向营级主官传达(将1张第227号命令加入卡组)
choice2_effect = replaceCard(第227号命令)

[siberian_transfer]
title = <事件>远东部队西调
image = res://assest/EventTest.png
description = 1941年秋，情报判定日本将南进而非北进。自远东方面军与后贝加尔方面军抽调约18个师、1700辆坦克，经西伯利亚大铁路西运，单师行程约两周。部队冬装齐备，多数有1939年哈拉哈河作战经验，未与德军交手。首批于10月抵达，投入12月的莫斯科反攻。
choice1_text = 整建制投入一线(将1张西伯利亚转移加入卡组)
choice1_effect = replaceCard(西伯利亚转移)
choice2_text = 打散补充到各师(将4张步兵第414团加入卡组，失去8点资源点)
choice2_effect = replaceCard(i414),replaceCard(i414),replaceCard(i414),replaceCard(i414),materialPoints(-8)

[arctic_convoy]
title = <事件>北极护航队
image = res://assest/EventTest.png
description = 盟国船队自冰岛启航，经北极航线驶往摩尔曼斯克与阿尔汉格尔斯克，载运坦克、飞机、卡车与食品。此季节为极昼，全程无夜暗可资掩护。德军以Fw 200远程侦察机与BV 138水上飞机实施跟踪。船队一经发现，即须承受来自空中与水下的连续攻击。
choice1_text = 等船队到港(将1张北极护航队加入卡组)
choice1_effect = replaceCard(北极护航队)
choice2_text = 提前撤走跑道上的物资(什么都不发生)
choice2_effect = none
choice3_text = 派飞机前往接应(失去8点资源点，额外获得1张北极护航队)
choice3_effect = materialPoints(-8),replaceCard(北极护航队),replaceCard(北极护航队)
