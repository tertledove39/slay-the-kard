[order_227]
title = <事件>第227号命令
image = res://assest/EventTest.png
description = 1942年7月28日，国防人民委员第227号命令签发。命令要求各方面军组建1至3个惩罚营，每营约800人；各集团军组建5至10个拦截连，每连约200人，配置于动摇部队后方。因怯战降职者编入惩罚营，负伤可恢复原衔。文件在部队中逐级宣读。
choice1_text = 按规定组建惩罚营与拦截连(将3张轻步兵加入卡组，另有1张卡被替换为预备役)
choice1_effect = replaceCard(轻步兵),replaceCard(轻步兵),replaceCard(轻步兵),replaceRandomCard(预备役)
choice2_text = 仅向营级主官传达(将1张第227号命令加入卡组)
choice2_effect = replaceCard(第227号命令)

[siberian_transfer]
title = <事件>远东部队西调
image = res://assest/EventTest.png
description = 1941年秋，情报判定日本将南进而非北进。自远东方面军与后贝加尔方面军抽调约18个师、1700辆坦克，经西伯利亚大铁路西运，单师行程约两周。部队冬装齐备，多数有1939年哈拉哈河作战经验，未与德军交手。首批于10月抵达，投入12月的莫斯科反攻。
choice1_text = 整建制投入一线(将1张西伯利亚转移加入卡组)
choice1_effect = replaceCard(西伯利亚转移)
choice2_text = 打散补充到各师(将4张步兵第414团加入卡组，失去8点资源点)
choice2_effect = replaceCard(i414),replaceCard(i414),replaceCard(i414),replaceCard(i414),materialPoints(-8)

[arctic_convoy]
title = <事件>北极护航队
image = res://assest/EventTest.png
description = 盟国船队自冰岛启航，经北极航线驶往摩尔曼斯克与阿尔汉格尔斯克，载运坦克、飞机、卡车与食品。此季节为极昼，全程无夜暗可资掩护。德军以Fw 200远程侦察机与BV 138水上飞机实施跟踪。船队一经发现，即须承受来自空中与水下的连续攻击。
choice1_text = 等船队到港(将1张北极护航队加入卡组)
choice1_effect = replaceCard(北极护航队)
choice2_text = 提前撤走跑道上的物资(什么都不发生)
choice2_effect = none
choice3_text = 派飞机前往接应(失去8点资源点，额外获得1张北极护航队)
choice3_effect = materialPoints(-8),replaceCard(北极护航队),replaceCard(北极护航队)
