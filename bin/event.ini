# ============================================================
# 事件配置文件
# 每节是一个事件，包含标题、图片、描述和选项
# choiceN_text  = 选项显示文字
# choiceN_effect = 选项效果，支持:
#   none                      无事发生
#   replaceCard(cardId)       玩家自选一张卡替换为cardId
#   replaceRandomCard(cardId) 随机一张卡替换为cardId
# ============================================================

[volunteer_regiment]
title = 志愿兵团
image = res://cards/来自人民.png
description = 来自后方工厂的志愿兵自愿加入前线。虽然缺乏正规训练，但他们的热情和数量足以弥补不足。你是否愿意接纳他们，替换现有编制中的一支队伍？
choice1_text = 接纳志愿兵（替换自选卡）
choice1_effect = replaceCard(轻步兵)
choice2_text = 婉拒（无事发生）
choice2_effect = none

[factory_evacuation]
title = 工厂疏散
image = res://cards/拖拉机厂.png
description = 前线战火逼近，一座重要的坦克工厂面临被德军占领的危险。工人和技术人员已经准备好转移设备。你可以将部分工人编入装甲部队。
choice1_text = 武装工人（替换自选卡为t70）
choice1_effect = replaceCard(t70)
choice2_text = 优先疏散设备（替换自选卡为喀秋莎）
choice2_effect = replaceCard(喀秋莎)

[lend_lease]
title = 租借法案援助
image = res://cards/北极护航队_r.png
description = 一支北极护航队在暴风雪中突破德军封锁，抵达了阿尔汉格尔斯克港。盟军的援助物资中包括了急需的武器装备。
choice1_text = 装备T-34（替换随机卡）
choice1_effect = replaceRandomCard(t34_1942)
choice2_text = 接收雅克-7战斗机（替换随机卡）
choice2_effect = replaceRandomCard(雅克7)
choice3_text = 继续行军
choice3_effect = none

[ambush_intel]
title = 敌军伏击情报
image = res://assest/ambush.png
description = 侦察兵截获了一份德军伏击计划。如果我们提前布置防御阵地，可以在敌军必经之路上设伏反击。但需要调配兵力。
choice1_text = 布置伏击（替换自选卡为正面突击）
choice1_effect = replaceCard(正面突击)
choice2_text = 派遣坦克部队（替换随机卡为T-34 1942）
choice2_effect = replaceRandomCard(t34_1942)

[partisan_support]
title = 游击队支援
image = res://cards/血红的镰刀.png
description = 活跃在敌后的游击队派来了联络员。他们可以提供关于敌军部署的珍贵情报，但需要一支正规部队配合他们的行动。
choice1_text = 派出联络队（替换自选卡为铁锤）
choice1_effect = replaceCard(铁锤)
choice2_text = 加强情报网络（替换随机卡为以剑之名）
choice2_effect = replaceRandomCard(以剑之名)
choice3_text = 婉拒合作
choice3_effect = none

[heavy_snow]
title = 暴风雪
image = res://cards/冬季战争_r.png
description = 一场罕见的暴风雪席卷了整个前线。德军的装甲部队陷入泥泞，对我方极为有利。但也考验着部队的耐寒能力。
choice1_text = 突击敌军阵地（替换自选卡为强袭）
choice1_effect = replaceCard(强袭)
choice2_text = 固守待援
choice2_effect = none

[railway_arrives]
title = 装甲列车抵达
image = res://cards/装甲列车_r.png
description = 一列满载补给和武器弹药的装甲列车从前线后方驶来，带来了急需的增援。列车上的重炮可以编入作战序列。
choice1_text = 接收装甲列车（替换自选卡）
choice1_effect = replaceCard(装甲列车)
choice2_text = 分配给步兵（替换随机卡为预备役）
choice2_effect = replaceRandomCard(预备役)

[cross_river]
title = 强渡第聂伯河
image = res://cards/大纵深作战.png
description = 前方是第聂伯河的宽阔水面。对岸的德军守卫严密。需要制定周密的渡河作战计划，调集足够的力量突破防线。
choice1_text = 正面强渡（替换自选卡为大纵深作战）
choice1_effect = replaceCard(大纵深作战)
choice2_text = 侧翼迂回（替换自选卡为机动防御）
choice2_effect = replaceCard(机动防御)

[political_officer]
title = 政治委员视察
image = res://cards/苏联国徽G.png
description = 来自莫斯科的政治委员前来视察前线部队。如果给他们留下好印象，或许能争取到更多的资源支持。
choice1_text = 展示战果（替换随机卡为伟大的卫国战争）
choice1_effect = replaceRandomCard(伟大的卫国战争)
choice2_text = 请求增援（替换自选卡为塔曼斯卡亚）
choice2_effect = replaceCard(塔曼斯卡亚)
choice3_text = 保持现状
choice3_effect = none

[heroic_squad]
title = 英雄侦察小队
image = res://cards/步兵第17团.png
description = 一支经验丰富的侦察小队在敌后完成了长达两周的任务，安全返回。他们的情报和战斗经验极为宝贵，作为精锐力量可以编入突击部队。
choice1_text = 编入近卫军（替换自选卡为近卫步兵272团）
choice1_effect = replaceCard(smileBro)
choice2_text = 归还原建制（替换随机卡为步兵第554团）
choice2_effect = replaceRandomCard(i554)
