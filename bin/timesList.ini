[times]
BeingAddedToField        target: 被加入战场的单位
Deployed                 target: 从手牌部署的单位
FriendlyTankDeployed     target: 部署的友方坦克
FriendlyInfantryDeployed target: 部署的友方步兵
Moving                   target: 移动的单位
Attacking                target: 攻击目标(to)
BeingAttacked            target: 被攻击单位(to), 攻击者(from)
BecomingAttackTarget     target: 成为敌方攻击目标的友方单位, 攻击者(from)
FightingInfantry         target: 被攻击的步兵单位(to)
AttackingHq              target: 被攻击的总部(to)
FriendlyUnitAttacking    target: 攻击目标(to), 攻击者(from)
EnemyUnitAttacking       target: 攻击目标(to), 攻击者(from)
FriendlyUnitBeingAttacked target: 被攻击的友方单位(to), 攻击者(from)
EnemyUnitBeingAttacked   target: 被攻击的敌方单位(to), 攻击者(from)
Dead                     target: 死亡的单位
FriendlyUnitDead         友方单位死亡时（场上所有剩余单位检查）
EnemyUnitDead            敌方单位死亡时（场上所有剩余单位检查）
FriendlyTurnEnd          
TurnEnd                  
EnemyTurnBegin           
TurnBegin                
FriendlyTurnBegin        
BePicked                 target: 被指向（成为攻击/指令选择目标）的单位

[keys]
Heal(n)                 增加目标防御力n点
damage(n)               减少目标防御力n点，不带参数时使用result值
GetAttack(n)            增加目标攻击力n点
LoseAttack(n)           减少目标攻击力n点
SetDefence(n)           设置目标防御力为n点
setCost(n)              设置目标费用为n点
addCost(n)              增加目标费用n点
subCost(n)              减少目标费用n点（最低0）
myHq                    友方总部
enemyHq                 敌方总部
this                    执行效果的单位本身
target                  目标单位
setResult(n)            将内存(result)设置为n
SetMemory(s,n)          设置自定义变量s为n
addDefence(n)           增加目标防御力n点（Heal的别名）
&variableName            读取自定义变量值，若不存在则初始化为0
&lifeTime               获取当前目标单位已存活的回合数
drawCard                抽等于result值的卡，默认抽1张
DrawACard(s,i)          尝试从卡组中抽出i张名字含s字符串的单位
DrawACardWithType(u,i)  从卡组中抽出i张类型为u的卡
DrawUnitCards(i)       从卡组中抽取i张单位卡（非指挥卡）
DiscardRandomly(i)      随机弃置i张卡
GetCardsBeingTreated    获得刚刚被抽到的卡的引用 注意效果在部署后才刷新
AddToHand(s)            将名字为s的卡加入手牌
DiscardWithName(s,i)    弃置i张名字含s的卡(若可能)
addToSupportLine(s)      添加卡id为s的卡到支援阵线
addToEnemySupportLine(s) 添加卡id为s的卡到敌方支援阵线
addToDeck(s)            将卡id为s的卡洗入卡组
GetPoint()              获得指挥点，存入result
GetPointMax()           获得指挥点槽，存入result
AddPointMax(n)          增加指挥点槽n点（不同时增加当前指挥点）
AddPoint(n)             增加指挥点n点（不超过当前指挥点槽）
getCount(${selector})    获取符合选择器条件的单位数量，存入result
GetTargetByIndex(n)      获得target中第n位的单位
if(condition)A|A:       条件跳转，满足条件则跳转到标签A
Jump&标签               跳转到指定标签
setTarget               设置目标为传入的targetCard
GetRandomFriendUnit()    随机获得一个友方单位
GetRandomEnemyUnit()     随机获得一个敌方单位
GetRandomFriendTarget()  随机获得一个友方目标(目标=单位+总部)
GetRandomEnemyTarget()   随机获得一个敌方目标(目标=单位+总部)
GetRandomNumber(min,max) 随机获得一个数字(包括两个参数,min,max)
KillAllTargets()        消灭列表上的所有单位（KillAllTarget为别名）
HealAllTargets()        完全修复单位，将列表上所有单位的防御力设置为历史最大值
GetAllEnemyUnits()      获得所有敌方单位
GetAllFriendUnits()     获得所有友方单位
GetAllEnemyTargets()    获得所有敌方目标(目标=单位+总部)
GetAllFriendTargets()   获得所有友方目标(目标=单位+总部)
Refresh                 刷新目标单位，使其回到可以移动和攻击的状态
AddTrait(trait)         为目标单位添加指定的特性(trait)
RemoveTrait(trait)      从目标单位移除指定的特性(trait)
Retreat(list)           使单位撤退：前线单位移动到支援阵线，友方单位尝试返回手牌，否则弃置
Discard(list)           挂起弃置操作，在所有效果结算完成后执行，不触发亡语
DiscardWithTarget       弃置当前targets（支持手牌），手牌直接播放弃牌动画
addANewUnitToBattlefieldWithCostAndType(t,c)  按类型t和费用c从非Unobtainable卡中选最接近的加入支援阵线
Play                    从手牌免费打出一张牌
Play(selector)          从手牌免费打出并选择目标
Choose(a,b)             显示2选1界面，执行选中卡效果
Develop                 显示3张随机卡选1加入手牌
Develop(selector)       按选择器筛选后显示3张选1
GetEffect("effectString") 为所有targets附加效果字符串
foreach...End&          遍历当前targets执行循环体
setTargets(selector)    按选择器设置targets列表
GetCardBeingAddToSupportLine  获得上一个加入支援阵线的卡
GetHighestAttackFriendUnit(t1,t2,...)  从友方指定类型单位中取攻击最高者随机选一
FightRandomEnemy()          使当前targets各自随机攻击一个敌方单位(不含总部)，不计入攻击次数
ShuffleIntoDeck              将当前targets洗入卡组
GetCardsShuffledIntoDeck     获得刚才洗入卡组的卡引用
losePointAtNextTurnBegin(n)  下回合开始时失去n点指挥点（不足则清零）

; 敌方行动配置约束：everyNt表示每N回合执行一次，禁止与ADD组合以免永久行动重复叠加
; 任意非开始菜单场景可通过/root/GameDialogue的PlayAsync(path,title)在战斗时点阻塞播放对白
&targetAttack           读取target[0]的攻击力
&targetDefence          读取target[0]的防御力
&targetCost             读取target[0]的费用
&sourceAttack           读取sourceCard的攻击力
&sourceDefence          读取sourceCard的防御力
&sourceCost             读取sourceCard的费用
&attackCountThisTurn    读取sourceCard本回合攻击次数
&overflow               读取上次攻击溢出的伤害
&lastDamage              读取上次战斗造成的伤害值
&theNumberOfSkirmisher   读取场上轻步兵单位数量
&LastdeadFriendlyLandUnit 读取上一个死亡的友方陆军单位ID
&friendCommandPoint     读取友方当前指挥点
&friendCommandPointMax  读取友方最大指挥点
&friendHandCount        读取友方手牌数量
&friendDeckRemainingCount 读取友方卡组剩余数量
&fieldFriendUnitCount   读取友方场上单位数量
&fieldEnemyUnitCount    读取敌方场上单位数量
&friendHqDefence        读取友方总部防御力
&enemyHqDefence         读取敌方总部防御力
&result                 当前效果段的result值

[conditions]
result>n, result>=n, result<n, result<=n, result==n, result!=n
targets.count>n, targets.count>=n, targets.count<n, targets.count<=n, targets.count==n, targets.count!=n
target.isFriend, !target.isFriend, target.isEnemy, !target.isEnemy, target.isHq, !target.isHq
target.cardType==类型名, target.cardType!=类型名
target.cost>n, target.cost>=n, target.cost<n, target.cost<=n, target.cost==n, target.cost!=n
target.attack>n, target.attack>=n, target.attack<n, target.attack<=n, target.attack==n, target.attack!=n
target.defence>n, target.defence>=n, target.defence<n, target.defence<=n, target.defence==n, target.defence!=n
target.lifeTime>n, target.lifeTime>=n, target.lifeTime<n, target.lifeTime<=n, target.lifeTime==n, target.lifeTime!=n
source.isFriend, source.isEnemy

[selectors]
allTargets              所有场上目标
allTargets.unit          所有场上单位
allTargets.unit.friend   所有友方场上单位
allTargets.unit.enemy    所有敌方场上单位
allTargets.unit.land     所有场上陆军（Infantry/Tank/Artillery）
allTargets.unit.air      所有场上空军（Plane/Bomber）
allTargets.unit.Infantry 所有场上步兵
allTargets.hq            所有总部
allTargets.hq.friend     友方总部
allTargets.hq.enemy      敌方总部
allCardInHand            所有手牌
allCardInHand.unit       所有手牌中的单位卡
allCardInHand.unit.friend  友方手牌中的单位卡
allCardInHand.command     所有手牌中的指令卡

可用筛选关键词：unit | hq | friend | enemy | command | land | air | Infantry | Tank | Plane | Bomber | Artillery

[targetTypes]
aUnit                    任意非HQ单位
aFriendlyUnit            任意友方单位
anEnemyUnit              任意敌方单位
aFriendlyTank            友方坦克
aFriendlyInfantry        友方步兵
aFriendlyPlane           友方飞机
aFriendlyBomber          友方轰炸机
aFriendlyArtillery       友方火炮
anEnemyTank              敌方坦克
anEnemyInfantry          敌方步兵
anEnemyPlane             敌方飞机
anEnemyBomber            敌方轰炸机
anEnemyArtillery         敌方火炮
myHq                     友方总部
enemyHq                  敌方总部
anyTarget                任意目标
friendlyTarget           任意友方目标
enemyTarget              任意敌方目标
NOTarget                 无需目标
