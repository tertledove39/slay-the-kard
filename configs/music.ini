artillery_medium_fire=res://assest/AU_Artillery_medium_fire_01a.wav,res://assest/AU_Artillery_medium_fire_01b.wav,res://assest/AU_Artillery_medium_fire_01c.wav,res://assest/AU_Artillery_medium_fire_01d.wav
