; 全局背景音乐槽位配置（MusicManager 读取）
;
; 规则：
;   1. [music] 段下每个键都是一个槽位，新增槽位不需要改代码。
;   2. 值可以写多首曲目，用英文逗号分隔，播放时随机抽取一首；只写一首就固定播放它。
;   3. 槽位名忽略大小写。
;   4. 本文件用分号作注释。# 不是注释符（含 = 的 # 行会被当成一个键），不要用。
;   5. 留空表示该槽位不播放音乐。

[music]
start_menu=res://assest/music/配乐1.mp3,res://assest/music/出发.mp3
world_map=res://assest/music/配乐1.mp3,res://assest/music/中国获得原子弹.mp3,res://assest/music/莫斯科郊外的晚上.mp3,res://assest/music/红莓花儿开.mp3
battle=res://assest/music/配乐1.mp3,res://assest/music/贝拉乔.mp3,res://assest/music/歌唱动荡的青春.mp3,res://assest/music/假如明天战争.mp3,res://assest/music/喀秋莎.mp3,res://assest/music/跨过高山越过平原.mp3,res://assest/music/牢不可破的联盟.mp3,res://assest/music/疲惫的太阳.mp3,res://assest/music/斯拉夫女人的告别.mp3,res://assest/music/天鹅湖.mp3,res://assest/music/同志们勇敢地前进.mp3,res://assest/music/最美好的未来.mp3    

; 战斗专属BGM：battleBGM_<敌人预设名>，预设名即 cards/enemyTurn.ini 的 section 名。
; 配了就用专属曲，没配就自动回退到上面的 battle 槽位。
; 例如：
;   battleBGM_DonBend=res://assest/music/配乐2.mp3
;   battleBGM_berlin_final_battle=res://assest/music/配乐3.mp3,res://assest/music/配乐4.mp3

; ── 音效槽位（SFX）────────────────────────────────────────────
; 与上面 [music] 段同格式：每个键是一个槽位，值可用英文逗号分隔多条，每次播放随机抽一条。
; 区别只在语义——音效没有「播完再切」的调度，每次播都重新抽。
;
; dead：单位阵亡时的爆炸音效。
;   素材范围是 assest/爆炸3.wav ~ 爆炸21.wav，但**下划线开头的不要用**
;   （assest/_爆炸16.wav、_爆炸17.wav、_爆炸19.wav 是未采用的版本），
;   所以这里只列可用的那 16 条。新增可用的爆炸音时在本行末尾追加即可。
[sfx]
flyby=res://assest/飞机飞过_单位.wav
;   flying 特效用（攻击者飘起来→摆动→落回）。注意与下面 plane_* 那两条区分：
;   那条是「攻击演出」，这两条是「单位部署 / 挪位置」。assest/飞机飞过_效果.wav 当前没有槽位引用。
dead=res://assest/爆炸3.wav,res://assest/爆炸4.wav,res://assest/爆炸5.wav,res://assest/爆炸6.wav,res://assest/爆炸7.wav,res://assest/爆炸8.wav,res://assest/爆炸9.wav,res://assest/爆炸10.wav,res://assest/爆炸11.wav,res://assest/爆炸12.wav,res://assest/爆炸13.wav,res://assest/爆炸14.wav,res://assest/爆炸15.wav,res://assest/爆炸18.wav,res://assest/爆炸20.wav,res://assest/爆炸21.wav
; 卡牌语音：[sfx] 槽位名 -> 卡牌写 playEffect = sfx(槽位名)。
; 槽位名用中文，与音效文件同名；iniHandler 只取 `=` 前的整段文本做键，中文键没问题。
严冬=res://assest/严冬.wav
战略重心=res://assest/战略重心.wav
红色旗帜=res://assest/红色旗帜.wav
嘿=res://assest/嘿.wav
阿嘿=res://assest/阿嘿.wav
朱可夫=res://assest/朱可夫.wav
拉伸=res://assest/October_Red.wav
预备役=res://assest/预备役.wav
; 研发卡语音：三档各一条素材，三家（美/苏/英）共用；卡上 playEffect = sfx(research_N) 即可。
; 分档按卡面 cost：3 = 初级、6「扩展」= 2级、9「高级」= 3级。
research_1=res://assest/MACHINE_Air_Compressor_100L_5_5HP_Stop_stereo.wav
research_2=res://assest/TOOL_Wrench_Long_RR1_stereo.wav
research_3=res://assest/TOOL_Wrench_Long_RR2_stereo.wav
; 两张「终极」指令卡各自一条专属音（素材名与卡名逐字对应）
stalins_organ=res://assest/AU_StalinsOrgan_03.wav
manhattan=res://assest/AU_Order_ManhattanProj_02.wav
; 指令卡没写 playEffect 时的默认音（见 battlefield_ 的 DefaultCommandPlayEffect）
咚=res://assest/咚.wav
; 步兵进场音（部署与加入战场都播）：按 attack+defence 分三档，边界见 battlefield_ 的常量。
; 路径照实际文件名原样写（三个素材的大小写本来就不统一）。
infantry_small=res://assest/AU_infantry_small_move_03.wav
infantry_medium=res://assest/AU_Infantry_medium_Move_04.wav
infantry_large=res://assest/AU_Infantry_Large_Move_02.wav
; 坦克与火炮的进场音，同一套三档规则（素材自己叫 Light/Medium/Heavy，槽位统一叫 small/medium/large）
tank_small=res://assest/Tank_Light_Move_Fx.wav
tank_medium=res://assest/Tank_Medium_Move_Fx.wav
tank_large=res://assest/Tank_Heavy_Move_Fx.wav
; 飞机（战斗机 Plane 与轰炸机 Bomber）的进场音：**部署与移动是两条不同的槽位**
; （素材就是按时机给的：depl = 部署、flyby = 移动，两组不通用），不分档。
; 每条写多个文件 = 每次随机抽一条（「同类型随机播放」就是 [sfx] 段本来的机制，不用写代码）。
; 部署音（素材 AU_depl_Fighter_small_*）
plane_deploy=res://assest/AU_depl_Fighter_small_01.wav,res://assest/AU_depl_Fighter_small_02.wav
; 移动音（素材 AU_Flyby_Fighter_small_v2_*）
plane_flyby=res://assest/AU_Flyby_Fighter_small_v2_01.wav,res://assest/AU_Flyby_Fighter_small_v2_02.wav
; 喀秋莎专属：开火（挂在 attackEffect 上）与进入阵地（挂在 playEffect 上，进场与移动都放）
katyusha_fire=res://assest/AU_Rocket_Art_Katyusha_fire_02.wav
katyusha_into_pos=res://assest/AU_Rocket_Art_Katyusha_IntoPos_01.wav
; 抽卡音（五条变体，每次随机抽一条——[sfx] 段本来就是「逗号分隔、随机抽一条」）
draw=res://assest/Draw_One_A.wav,res://assest/Draw_One_B.wav,res://assest/Draw_One_C.wav,res://assest/Draw_One_D.wav,res://assest/Draw_One_E.wav
; 按键音：世界地图界面所有按钮 + 战斗界面的「下一回合」按钮，按下时响一声。
; 挂载点见 bin/UiClickSound.cs（槽位名是那里的 ClickSlot 常量，改这里即可换音）。
button=res://assest/General_button2.wav
; ===== 坦克与火炮的开火 / 命中音 =====
; 分档标准与进场音同一套：attack+defence ≤4 小 / 5~8 中 / ≥9 大。
; 每档多条，逗号分隔随机抽一条——与 draw / dead 同一套机制。
; **坦克**：只有中/大两套开火素材，所以小的也用 medium；命中音不分档。
tank_cannon_medium=res://assest/AU_Tank_cannon_medium_fire_01.wav,res://assest/AU_Tank_cannon_medium_fire_02.wav,res://assest/AU_Tank_cannon_medium_fire_03.wav,res://assest/AU_Tank_cannon_medium_fire_04.wav
